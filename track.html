<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track order</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="header" id="site-header"></header>
  <main class="main" id="main">
    <div class="wrap" style="max-width:560px">
      <div class="page-head"><h1>Track your order</h1></div>
      <div class="panel">
        <p class="crumb">No account needed &mdash; the email you ordered with and
          your order reference are enough.</p>
        <form id="track-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="reference">Order reference
              <span class="hint">On your confirmation, something like SO-1A2B3C.</span></label>
            <input class="input" id="reference" required autocomplete="off">
          </div>
          <button class="btn btn--block" type="submit" id="find">Find my order</button>
        </form>
        <div id="track-note"></div>
      </div>
    </div>
  </main>
  <footer class="footer" id="site-footer"></footer>
  <script type="module" src="js/track.js"></script>
</body>
</html>
