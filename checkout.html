<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="header" id="site-header"></header>

  <main class="main" id="main">
    <div class="wrap">
      <div class="page-head"><h1>Checkout</h1></div>

      <div class="split">
        <form id="checkout-form" novalidate>
          <div class="panel">
            <h2>Where should it go?</h2>

            <div class="row2">
              <div class="field">
                <label for="name">Full name</label>
                <input class="input" id="name" name="name" autocomplete="name" required>
                <p class="field__error" hidden></p>
              </div>
              <div class="field">
                <label for="phone">Phone</label>
                <input class="input" id="phone" name="phone" inputmode="tel" autocomplete="tel" required>
                <p class="field__error" hidden></p>
              </div>
            </div>

            <div class="field">
              <label for="email">Email <span class="hint">Your invoice and order updates go here.</span></label>
              <input class="input" id="email" name="email" type="email" autocomplete="email" required>
              <p class="field__error" hidden></p>
            </div>

            <div class="field">
              <label for="address">Address</label>
              <input class="input" id="address" name="address" autocomplete="street-address" required>
              <p class="field__error" hidden></p>
            </div>

            <div class="row2">
              <div class="field">
                <label for="city">City</label>
                <input class="input" id="city" name="city" autocomplete="address-level2" required>
                <p class="field__error" hidden></p>
              </div>
              <div class="field">
                <label for="state">State</label>
                <input class="input" id="state" name="state" autocomplete="address-level1" required>
                <p class="field__error" hidden></p>
              </div>
            </div>

            <div class="field" style="max-width:220px">
              <label for="pincode">Pincode</label>
              <input class="input" id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" required>
              <p class="field__error" hidden></p>
            </div>
          </div>

          <div class="panel">
            <h2>How would you like to pay?</h2>
            <div id="pay-options"></div>
            <div id="pay-note"></div>
          </div>

          <button class="btn btn--block" type="submit" id="place" style="margin-top:18px">
            Place order
          </button>
          <p class="crumb" style="margin-top:10px">
            Your card details never touch this storefront — the gateway collects them.
          </p>
        </form>

        <aside>
          <div class="panel panel--sticky">
            <h2>Order summary</h2>
            <ul class="lines" id="mini-lines"></ul>
            <ul class="totals" id="totals"></ul>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
