<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop</title>
  <meta name="description" content="A reference storefront built on the Merch storefront API.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="header" id="site-header"></header>

  <main class="main" id="main">
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1 id="hero-title">Shop</h1>
          <p id="hero-sub"></p>
        </div>
      </div>

      <!-- Filters are a real <form>: submitting with Enter works, and the
           browser handles the keyboard for us. -->
      <form class="filters" id="filters" role="search">
        <div class="field">
          <label for="f-search">Search</label>
          <input class="input" type="search" id="f-search" name="search" placeholder="Try “coffee”">
        </div>
        <div class="field">
          <label for="f-category">Category</label>
          <select class="select" id="f-category" name="category">
            <option value="">All</option>
          </select>
        </div>
        <div class="field">
          <label for="f-sort">Sort</label>
          <select class="select" id="f-sort" name="sort">
            <option value="">Featured</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="name">Name</option>
          </select>
        </div>
        <div class="field">
          <label class="check" for="f-instock">
            <input type="checkbox" id="f-instock" name="inStock">
            In stock only
          </label>
        </div>
        <button class="btn" type="submit">Apply</button>
        <button class="btn btn--ghost" type="button" id="f-clear">Clear</button>
        <span class="chip chip--inline" id="f-brand-note" hidden></span>
      </form>

      <!-- The API-driven home: GET /api/homepage decides what shows here and in
           what order (banners, categories, brands, product rails). Hidden until
           it loads; the catalogue grid below always works without it. -->
      <section id="home" aria-busy="true"></section>

      <section id="collections" hidden>
        <h2>Collections</h2>
        <div class="grid" id="collections-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"></div>
      </section>

      <h2 id="results-heading" class="sr-only">Products</h2>
      <div class="grid" id="products" aria-busy="true"></div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <!-- type="module" gives us real imports across files. It does mean the page
       must be served over http:// — opening it as file:// will be blocked by
       the browser. See the README for the one-line server. -->
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
