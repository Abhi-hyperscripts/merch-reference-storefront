<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="header" id="site-header"></header>

  <main class="main" id="main">
    <div class="wrap">
      <div class="page-head"><h1>Your cart</h1></div>

      <div class="split">
        <div>
          <div class="panel" id="cart-panel" aria-busy="true"></div>
        </div>

        <aside>
          <div class="panel panel--sticky" id="summary" hidden>
            <h2>Summary</h2>

            <ul class="totals" id="totals"></ul>

            <div class="field">
              <label for="coupon">Coupon code</label>
              <div class="apply">
                <input class="input" id="coupon" placeholder="e.g. SAVE10" autocomplete="off">
                <button class="btn btn--ghost" type="button" id="apply-coupon">Apply</button>
              </div>
              <div id="coupon-note"></div>
              <div id="auto-note"></div>
            </div>

            <div class="field">
              <label for="giftcard">Gift card</label>
              <div class="apply">
                <input class="input" id="giftcard" placeholder="Card code" autocomplete="off">
                <button class="btn btn--ghost" type="button" id="apply-gift">Check</button>
              </div>
              <div id="gift-note"></div>
            </div>

            <div class="field">
              <label for="pincode">Delivery pincode <span class="hint">Check the shipping cost before you commit.</span></label>
              <div class="apply">
                <input class="input" id="pincode" inputmode="numeric" placeholder="110001" autocomplete="postal-code">
                <button class="btn btn--ghost" type="button" id="check-ship">Check</button>
              </div>
              <div id="ship-note"></div>
            </div>

            <a class="btn btn--block" href="checkout.html" id="to-checkout">Checkout</a>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>
  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
